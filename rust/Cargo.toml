[package]
name = "desktop-mcp"
version = "0.4.0"
edition = "2024"
description = "Screenshot-free desktop control MCP server for KDE Plasma (Wayland), built on AT-SPI"
license = "MIT"

[dependencies]
evdev = "0.13"
futures-util = "0.3"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-std", "io-util", "sync", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
