[package]
name = "desktop-mcp"
version = "0.7.0"
edition = "2024"
description = "Screenshot-free desktop control MCP server for KDE Plasma (Wayland), Hyprland and Windows"
license = "MIT"

[dependencies]
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "process", "io-std", "io-util", "sync", "fs", "net"] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
fontdue = "=0.9.5"
png = "=0.18.0"
serde = "1"
smithay-client-toolkit = { version = "=0.21.1", default-features = false }
wl-clipboard-rs = "=0.9.4"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
png = "=0.18.0"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
