[project]
name = "kde-desktop-mcp"
version = "0.3.0"
description = "Screenshot-free desktop control MCP server for KDE Plasma (Wayland), Hyprland and Windows, with a per-app allowlist"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0,<2",
    "anyio>=4",
    # KDE Plasma: PyGObject (gi) and AT-SPI come from the system packages;
    # create the venv with --system-site-packages so they are importable.
    "evdev>=1.7; sys_platform == 'linux'",
    # Windows: UI Automation and window screenshots.
    "uiautomation>=2.0.20,<3; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]
